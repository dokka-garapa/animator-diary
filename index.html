<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アニメーターあるある日記</title>
<style>
:root{--bg:#faf7f2;--fg:#2b2622;--card:#fff;--ac:#d9480f;--mu:#8a8178;--bd:#e6dfd5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a17;--fg:#f1ece4;--card:#2a2622;--ac:#ff8a4c;--mu:#a69d92;--bd:#3d3731}}
:root[data-theme="dark"]{--bg:#1d1a17;--fg:#f1ece4;--card:#2a2622;--ac:#ff8a4c;--mu:#a69d92;--bd:#3d3731}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.m{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.m span{width:64px;color:var(--mu)}
.bar{flex:1;height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
button{display:block;width:100%;text-align:left;font:inherit;color:var(--bg);background:var(--ac);border:none;font-weight:600;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}
button:active{opacity:.75}
.day{color:var(--mu);font-size:13px}
.res{color:var(--ac);font-size:14px}
.big{font-size:20px;font-weight:700}
</style></head><body><main>
<h1>🎞 アニメーターあるある日記</h1>
<p class="day">〆切までの10日間。笑って乗り切ろう！</p><div id="app"></div>
</main>
<script>
var EV=[
{t:"作画監督から修正が入った。「ここ、もうちょっと芝居つけて」",c:[["素直に直す",{p:-4,h:-8,m:-3},"直したら確かに良くなった。ちょっと悔しい。"],["「これで通ります」と信じて出す",{p:2,h:0,m:-8},"リテイクで戻ってきた。"]]},
{t:"制作進行さんから連絡。「今どんな感じですか〜？」",c:[["「8割です」と答える",{p:0,h:0,m:3},"実際は3割。心が少し痛い。"],["正直に「3割です」と言う",{p:0,h:0,m:-4},"「…がんばりましょう」と返ってきた。"]]},
{t:"参考資料にYouTubeを開いた。気づけば猫の動画を見ている。",c:[["最後まで見る",{p:-2,h:0,m:8},"猫は正義。でも時計を見て青ざめた。"],["すぐ閉じる",{p:3,h:0,m:-3},"えらい。でも猫は見たかった。"]]},
{t:"ソフトが突然落ちた。最後に保存したのは…いつだっけ？",c:[["泣きながらやり直す",{p:-6,h:-5,m:-6},"二度目は一度目より速かった。なぜか。"],["実はこまめに保存していた",{p:1,h:0,m:5},"過去の自分、ありがとう。"]]},
{t:"深夜2時。コンビニの明かりが妙に優しい。",c:[["エナドリを買って戻る",{p:4,h:-4,m:-2},"目は冴えたが、明日が不安。"],["今日は帰って寝る",{p:-1,h:12,m:3},"布団がやわらかい。"]]},
{t:"右手首が重い。腱鞘炎の予感がする。",c:[["湿布とストレッチをする",{p:-2,h:6,m:2},"ちょっと楽になった。"],["気合いで描く",{p:5,h:-10,m:-2},"描けた。でも手が悲鳴を上げている。"]]},
{t:"前日の夜に連絡。「カット順が変わりました」",c:[["黙って対応する",{p:-3,h:-4,m:-6},"タイムシートを全部見直した。"],["「聞いてない…」と机に突っ伏す",{p:0,h:2,m:-2},"三十秒だけ復活した。"]]},
{t:"友だちに言われた。「アニメの仕事って楽しそう！」",c:[["「楽しいよ」と笑う",{p:0,h:0,m:8},"本当に楽しい瞬間を思い出した。"],["「楽しいけど時間が…」と語る",{p:0,h:-2,m:3},"話し始めたら止まらなかった。"]]},
{t:"同僚から差し入れ。「これ食べて」とお菓子が置かれた。",c:[["ありがたくいただく",{p:0,h:3,m:10},"糖分が全身に染みわたる。"],["「あとで…」と机に置く",{p:2,h:0,m:3},"気づいたら空になっていた。"]]},
{t:"制作さんから連絡。「このカット、タイムシートの秒数が合ってません」",c:[["平謝りして直す",{p:-2,h:-3,m:-4},"次のカットと秒数を間違えていた。ありがたい指摘。"],["「えっ、合ってるはず…」と見直す",{p:-1,h:-2,m:-2},"見直したら次のカットの秒数と間違えていた。"]]},
{t:"つい楽しくなって、原画をびっしり描き込んでしまった。",c:[["このまま出す",{p:3,h:-3,m:5},"「動画さんが泣くので減らしてください」と戻ってきた。"],["線を減らしてシンプルにする",{p:-2,h:-4,m:-2},"動画さんが助かる。みんなが幸せになる。"]]},
{t:"前の人の原画を見て固まった。何を描いたのか分からない。",c:[["推理しながら読み解く",{p:-3,h:-5,m:-2},"謎が解けた瞬間は少し気持ちいい。"],["作監に聞きに行く",{p:-1,h:0,m:-4},"「あ、それ僕も分からない」と返ってきた。"]]},
{t:"ポーズの資料がほしくて、鏡の前で変なポーズを取っている。",c:[["スマホで撮って参考にする",{p:6,h:-2,m:2},"誰にも見せられない写真が増えた。でも描きやすい。"],["想像で描く",{p:2,h:0,m:-3},"関節がおかしい。やっぱり撮ればよかった。"]]},
{t:"SNSを開いたら、同業者の神作画が流れてきた。",c:[["刺激をもらって気合いが入る",{p:4,h:-3,m:4},"よし、自分も描こう。"],["自分と比べて落ち込む",{p:-2,h:0,m:-8},"みんなすごすぎる。でも自分の線も悪くない。"]]},
{t:"夜食のカップ麺ができた。三分待つ間に、つい絵を描き始めた。",c:[["そのまま描き続ける",{p:5,h:-3,m:0},"気づいたら麺がのびていた。でも進んだ。"],["ちゃんと待って食べる",{p:0,h:5,m:5},"のびていない麺は、やはりおいしい。"]]},
{t:"全カットにリテイクが入った。机の上は付箋だらけだ。",c:[["一個ずつ丁寧に直す",{p:-5,h:-8,m:-6},"直した分だけ絵がよくなった。たぶん。"],["まず深呼吸してお茶を飲む",{p:-3,h:2,m:2},"落ち着いた。そして付箋は減っていない。"]]},
{t:"急に絶好調！ 手が勝手に動いて、いい芝居が描けている。",c:[["この波に乗る",{p:12,h:-6,m:6},"今日のカットは自分でも気に入った。"],["一回保存してから続ける",{p:8,h:-3,m:4},"保存は大事。流れも途切れなかった。"]]},
{t:"作業用に流していたアニメが気になって、手が止まった。",c:[["一話だけ最後まで見る",{p:-2,h:0,m:8},"作画に見入ってしまった。これも勉強、たぶん。"],["音だけ聞いて作業に戻る",{p:3,h:-2,m:0},"耳で楽しむ。今日はこれで十分。"]]},
{t:"定規と消しゴムが机の上から行方不明になった。",c:[["探し回る",{p:-2,h:-2,m:-3},"結局、すぐ目の前に置いてあった。"],["代わりを使ってしのぐ",{p:1,h:0,m:-1},"いつもの道具じゃないと落ち着かない。"]]},
{t:"資料を探していたら、気づけば関連動画の海に迷い込んでいた。",c:[["もう少しだけ調べる",{p:-3,h:-2,m:-3},"気づけば3時間。何を探していたか忘れた。"],["30分で切り上げて描き始める",{p:4,h:-2,m:0},"資料は足りないけど、描けば分かる。"]]},
{t:"寝る前にいいアイデアを思いついた。…朝起きたら、何も思い出せない。",c:[["メモせずに寝てしまった",{p:-3,h:10,m:-5},"あの構図はどこへ行ったのか。"],["枕元にメモを置いて寝た",{p:2,h:8,m:2},"朝見たら、字が読めなかった。でも何かは残った。"]]},
{t:"自分の原画がうまくいかず、他の人に振り直すことになった。",c:[["素直に受け入れる",{p:8,h:2,m:-10},"仕事が減って進捗は進む。でも悔しい。次に活かそう。"],["悔しいので夜に自主練する",{p:4,h:-6,m:-4},"描いた分だけ、少しは上手くなる…はず。"]]},
{t:"自分の技量では厳しいカットが来た。制作さんにメールを書く。",c:[["「すみません。できないです。」と送る",{p:0,h:5,m:-4},"送信ボタンを押すまで3時間かかった。"],["ムリして受ける",{p:-5,h:-8,m:-6},"結局、苦しみながら描くことになった。"]]},
{t:"仕事を並行で受けていたら、全部の〆切が近づいてきた。",c:[["全部やろうとする",{p:3,h:-10,m:-8},"どれも中途半端で、間に合わない予感。"],["優先順位をつけて連絡する",{p:-2,h:-2,m:-3},"正直に相談したら、意外と調整してもらえた。"]]},
{t:"単価の安い仕事を受けた直後に、単価の高い仕事の依頼が来た。",c:[["泣く泣く断る",{p:0,h:0,m:-8},"安い仕事を描く手が、少し震えた。"],["こっそり受ける",{p:-5,h:-10,m:-6},"やることが増えて、どちらも進まなくなった。"]]},
{t:"リテイクを直したのに、また戻ってきた。面談に呼ばれて「やる気はあるの？」と聞かれた。",c:[["「あります」と答える",{p:-2,h:-2,m:-8},"あるけど、技術が追いつかない。"],["アドバイスを必死にメモする",{p:2,h:-2,m:-4},"メモを取ったら、少しだけ前向きになれた。"]]},
{t:"作業中、強く思った。「もうこの仕事が終わったら辞める」",c:[["その気持ちを力に変える",{p:6,h:-6,m:-4},"終わったら辞める。…終わったらどうなるんだっけ？"],["布団に入って一旦忘れる",{p:-1,h:10,m:3},"翌朝には、少し気持ちが軽くなっていた。"]]},
{t:"誰かに聞かれた。「アニメーターって楽しい？」",c:[["「…うん、まあ。」と答える",{p:0,h:0,m:2},"強く肯定はできないけど、否定もできない。"],["「楽しい時もあるよ」と笑う",{p:0,h:0,m:4},"正直な答えに、自分でも少し安心した。"]]},
{t:"紙で作業中、カット袋を振ったら、お金の音が聞こえた気がした。",c:[["幻聴でも嬉しい",{p:3,h:0,m:8},"チャリン。気のせい。でも、たとえ単価が低くても塵も積もれば。と思えた。"],["上がり一覧のメモに書き加える",{p:4,h:0,m:5},"上がったカットを一覧に書き足した。増えていくのを見ると、気持ちが落ち着く。"]]},
{t:"作画監督から一言。「ここ、いい芝居だね」",c:[["照れながらお礼を言う",{p:3,h:3,m:12},"今日は一日、いい気分で描ける。"],["顔に出さずにニヤける",{p:5,h:2,m:10},"家で思い出して、もう一度ニヤけた。"]]},
{t:"自分が関わったアニメが放送された。SNSで感想を見つけた。",c:[["ドキドキしながら読む",{p:2,h:0,m:12},"「作画が良かった」の一言で、全部報われた。"],["そっとスクロールして閉じる",{p:4,h:0,m:6},"照れくさいけど、ちょっと嬉しい。"]]},
{t:"名だたる監督さんから「あのカット、良かったよ」と褒められた。",c:[["監督作を見返す",{p:-1,h:-1,m:10},"あの芝居の間の取り方、やっぱりすごい。"],["文章にしてメモを残す",{p:2,h:-2,m:8},"言われた言葉を書き残した。しんどい日に読み返そう。"]]},
{t:"好きなアニメのBlu-ray発売記念の試写会があるらしい。",c:[["行けるか分からないが応募する",{p:-1,h:0,m:10},"応募ボタンを押した。当たったら〆切と相談しよう。"],["自分だけで祝い酒する",{p:-2,h:-3,m:12},"好きなアニメを肴に、ひとり祝杯。明日も描こう。"]]},
{t:"絵コンテにない芝居を思いついた。",c:[["こっそり入れてみる",{p:3,h:-3,m:6},"通ったかは分からないけど、描いていて楽しかった。"],["自信がないのでやめておく",{p:2,h:0,m:-2},"そっと消した。でも、あの芝居はちょっと惜しかった。"]]},
{t:"SNSに、自分が原画を担当したカットのスクショを投稿しているファンの方がいた。",c:[["その投稿をスクショする",{p:0,h:0,m:12},"「元気が出る画像」フォルダが、また一枚増えた。"],["心の中でガッツポーズする",{p:2,h:0,m:10},"顔は真顔のまま、心は全力で拳を突き上げた。"]]},
{t:"アニメ映画を観に来たら、とても良かった。クレジットが流れ始めた。",c:[["名前をしっかりと目で追う",{p:0,h:0,m:10},"過去に辞めた先輩の名前を見つけて、ほっとした。"],["クレジットは見ない",{p:0,h:0,m:8},"心の安寧を優先して、えらい、と自分を褒めた。"]]},
{t:"気づいたら、料理にハマっていた。",c:[["毎日何を作るか楽しみになる",{p:-4,h:3,m:10},"冷蔵庫を開けるのが楽しい。進捗は、ちょっと遅れた。"],["仕事の進みを優先して、凝った自炊は減らす",{p:5,h:-2,m:-4},"簡単なご飯でしのいだ。ちょっと寂しい。"]]},
{t:"TVを買ったら、自動補間フレーム機能がデフォルトでONになっていることに気づいた。",c:[["泣く泣くそのままにする",{p:0,h:0,m:-8},"ヌルヌル動く画面を見て、心の中で何かが小さく泣いた。"],["耐えられないので、何がなんでもOFFにする",{p:-3,h:0,m:0},"設定画面を探し回って1時間。でも、正しい動きが戻ってきた。"]]},
{t:"後輩が「分からないことがあります」と言ってきた。…自分も分からなかった。",c:[["「あとで教えてもらおう」とその場は流す",{p:3,h:0,m:0},"その場は何とかなった。あとでこっそり調べよう。"],["自分も知りたいので、先輩に確認する",{p:0,h:0,m:-6},"知らないと言うのは少し勇気が要った。でも一緒に学べた。"]]},
{t:"トイレに行きたい。でも、今ちょうど筆が乗っている。",c:[["我慢して描き続ける",{p:6,h:-5,m:-4},"いいところまで描けた。立ち上がったら全てが限界だった。"],["ちゃんと行く",{p:-1,h:2,m:4},"スッキリした。線もスッキリした気がする。"]]}
];
var AC=[
["集中して原画を描く","進捗 大 / 体力 大消費",function(){return{p:12+r(7),h:-16,m:-5}},"線が走った。"],
["雑談を交えながら原画を描く","進捗 中 / メンタル回復",function(){return{p:8+r(4),h:-8,m:5}},"雑談で笑いながらも、手はちゃんと進んでいた。"],
["仮眠する","体力回復",function(){return{p:0,h:20,m:5}},"目覚めたら30分だけのつもりが2時間だった。"],
["ちょっと休憩して散歩","メンタル回復",function(){return{p:1,h:3,m:12}},"外の空気がおいしい。"]
];
var S,ph,msg,ev;
function r(n){return Math.floor(Math.random()*n)}
function cl(x){return Math.max(0,Math.min(100,x))}
function start(){S={d:1,p:0,h:80,m:80};ph=0;msg="";ev=EV[r(EV.length)];draw()}
function apply(f){S.p=cl(S.p+f.p);S.h=cl(S.h+f.h);S.m=cl(S.m+(f.m<0?Math.ceil(f.m/2):f.m))}
function bar(n,v){return '<div class="m"><span>'+n+'</span><div class="bar"><i style="width:'+v+'%"></i></div><b>'+v+'</b></div>'}
function draw(){
 var a=document.getElementById("app"),h="";
 if(ph==9){a.innerHTML=ending();return}
 h+='<div class="card"><div class="day">'+S.d+' 日目 / 10 日（〆切まで）</div>'+bar("進捗",S.p)+bar("体力",S.h)+bar("メンタル",S.m)+'</div>';
 if(ph==0){
  h+='<div class="card">'+ev.t+'</div>';
  ev.c.forEach(function(c,i){h+='<button onclick="pickE('+i+')">'+c[0]+'</button>'});
 }else if(ph==1){
  h+='<div class="card res">'+msg+'</div><div class="card">今日の作業は？</div>';
  AC.forEach(function(c,i){h+='<button onclick="pickA('+i+')">'+c[0]+'<br><small>'+c[1]+'</small></button>'});
 }else{
  h+='<div class="card res">'+msg+'</div><button onclick="next()">次の日へ</button>';
 }
 a.innerHTML=h;
}
function pickE(i){var c=ev.c[i];apply(c[1]);msg=c[2];ph=1;if(chk())return;draw()}
function pickA(i){var c=AC[i],f=c[2]();apply(f);msg=c[3]+"（進捗 "+(f.p>=0?"+":"")+f.p+"）";ph=2;if(chk())return;draw()}
function chk(){if(S.p>=100||S.h<=0||S.m<=0){ph=9;draw();return true}return false}
function next(){
 S.d++;S.h=cl(S.h-1);S.m=cl(S.m+2);
 if(S.d>10){ph=9;draw();return}
 ev=EV[r(EV.length)];ph=0;if(chk())return;draw()
}
function ending(){
 var t,d;
 if(S.p<100&&(S.h<=0||S.m<=0)){t="机で寝落ちしてしまった…";d="気づいたら朝。誰かがそっと毛布をかけてくれていた。今日はゆっくり休んで、また描こう。"}
 else if(S.p>=100&&r(5)>0){var K=[["打ち上げでお腹いっぱい！","納品から数日後、打ち上げパーティに呼ばれた。美味しいご飯をたくさん食べて、笑って帰った。このためにがんばったのかも。"],["自分なりに大満足！","SNSで「神作画」と話題になったわけではない。でも、自分としてはある程度満足できるカットが描けた。それで十分、いい仕事だった。"],["「上手くなったね」","周りの人から「上手くなったね」と言われた。そして、次の仕事もすぐに振られた。うれしい悲鳴だ。"],["公式アカウントに切り抜かれた！","放送後、公式アカウントで自分の担当カットが切り抜かれていた。思わず画面の前で小さく拍手した。"]];var k=K[r(4)];t=k[0];d=k[1]}
 else if(S.p>=100&&S.h>=40&&S.m>=40){t="完璧な納品！";d="期日どおりに納品し、心もまだ元気。ここまでできたら、もう伝説のアニメーター。"}
 else if(S.p>=100){t="ギリギリ納品…";d="何とか間に合った。ふらふらだけど、エンドロールに自分の名前が出る日が楽しみだ。「もう辞める」と思っていたのに、納品の瞬間には爽快感で消えていた。"}
 else{t="あと一歩で間に合わず！";d="進捗 "+S.p+"％。制作さんの「…あと何カット残ってますか？」の声がやさしい。次はきっといける！"}
 return '<div class="card"><div class="big">'+t+'</div><p>'+d+'</p>'+bar("進捗",S.p)+bar("体力",S.h)+bar("メンタル",S.m)+'</div><button onclick="start()">もう一度あそぶ</button>';
}
start();
</script></body></html>
