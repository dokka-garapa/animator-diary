<style>
:root{--bg:#faf7f2;--fg:#2b2622;--card:#fff;--ac:#d9480f;--mu:#8a8178;--bd:#e6dfd5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a17;--fg:#f1ece4;--card:#2a2622;--ac:#ff8a4c;--mu:#a69d92;--bd:#3d3731}}

html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.m{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.m span{width:64px;color:var(--mu)}
.bar{flex:1;height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
button{display:block;width:100%;text-align:left;font:inherit;color:var(--bg);background:var(--ac);border:none;font-weight:600;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}
button:active{opacity:.75}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#lg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
#lg button{width:auto;padding:4px 8px;margin:0;font-size:12px;border-radius:8px}
#lg button.on{outline:2px solid var(--fg)}
[dir=rtl] button{text-align:right}
[dir=rtl] .top{flex-direction:row-reverse}
.day{color:var(--mu);font-size:13px}
.res{color:var(--ac);font-size:14px}
.big{font-size:20px;font-weight:700}
</style></head><body><main>

var KZ=[["庆功宴大餐！","后来被邀请参加庆功宴。吃了很多美味的饭菜，笑着回家。也许这就是努力的意义。"],["自己觉得很满足！","没有被捧成社交软件上的“神作画”。但就我自己而言，画出了相当满意的镜头。这就足够了。"],["“你进步了呢”","周围的人说“你进步了呢”。接着，下一份工作马上就来了。幸福的烦恼。"],["被官方账号截取了！","播出后，官方账号截取了自己负责的镜头。忍不住在屏幕前悄悄鼓了掌。"],["奖励甜点！","交稿后，买了一直忍着没买的高级甜点。吃了一口，不禁嘟囔：“我赢了。”"],["字幕里有我的名字！","播出那天，在片尾字幕里找到了自己的名字。看多少遍都觉得心里暖暖的。"],["悠闲三天","交稿后什么安排都没排，躺平了三天。幸福的时光。"],["前辈的慰劳","前辈送来热乎乎的慰劳：“辛苦了。”这份工作，坚持下来真好。"],["下一部作品在等着","收到消息：“下次也拜托你了。”一边幸福地尖叫，一边已经在想象新的镜头。"]];
var HZ=[["在桌上睡着了……","醒来已是早晨。有人轻轻给我盖了毯子。今天好好休息，再接着画吧。"],["电量耗尽，沉沉入睡！","像没电一样睡着了。醒来发现枕边放着一个饭团。真感激。"],["强制午睡时间","同事说：“今天赶紧回家睡吧。”乖乖回家，被窝像天堂一样柔软。"],["梦里作画","睡着后在梦中，不知为何画得行云流水。醒来趁着没忘赶紧记了下来。"],["好好休养","果断决定休息一天。泡了澡，吃了饭，睡了个好觉。恢复后再接着画吧。"],["加入拉伸教室","腰和肩膀到极限了。下决心去上拉伸课。身体放松后，线条好像也变柔和了。"],["泡温泉暖暖身子","体力耗尽倒下后，在温泉里慢慢恢复。泡完喝的咖啡牛奶是世界上最好喝的。"],["零食堆成山","趴在桌上，周围的人送来了一堆零食。面对零食山，笑着满血复活。"],["买了新椅子","腰撑不住了，终于买了把好椅子。一坐下就像到了天堂。期待明天的工作。"],["早睡早起大作战","决定重新调整生活节奏。沐浴着晨光画出的画，线条比平时更明亮。"]];
var MZ=[["换个心情的小旅行","为了调整心态，去了附近的温泉。在蒸汽里想着：“总会有办法的。”"],["和猫度过的一天","今天不画了，一整天只看猫咪视频。猫咪一句话也不说，却能治愈人心。"],["朋友听我倾诉","和朋友吃饭，尽情吐槽。笑着笑着，心里轻松了。"],["追完喜欢的动画","为了换心情，一口气追完了超喜欢的动画。想起了动画真好。感觉明天又能画了。"],["一个人的卡拉OK大会","下决心一个人去唱卡拉OK。放声高歌后，脑子清爽了。嗓子哑了，心却很有精神。"],["靠拉面复活","心情低落时，吃点好吃的最管用。热腾腾拉面的蒸汽，让心也暖和了起来。"],["散步时抬头看天","走出门抬头看天，云朵的形状看起来很好吃。光是这样，就让人微微一笑。"],["重看以前的原画","重看以前自己的原画，心想：“原来我挺努力的嘛。”稍微喜欢上了自己。"],["和同期线上喝酒","和同期隔着屏幕互相吐槽。大家烦恼的都是一样的事，笑个不停。"],["随手画了张轻松的画","把工作抛到脑后，随手涂鸦。即兴画的画，意外地可爱。"]];

["Le chargé de production écrit : « Ça avance comment ? »",["Répondre « À 80 % »","En vrai, c’est 30 %. Ça fait un peu mal."],["Dire honnêtement « 30 % »","Réponse : « …Courage. »"]],
["Tu ouvres YouTube pour une référence. Soudain, tu regardes des vidéos de chats.",["Regarder jusqu’au bout","Les chats ont toujours raison. Puis tu vois l’heure et tu pâlis."],["Fermer tout de suite","Bravo. Mais tu voulais voir les chats."]],
["Le logiciel plante. Quand as-tu sauvegardé pour la dernière fois ?",["Tout refaire en pleurant","La deuxième fois, c’était plus rapide. Mystère."],["En fait, tu sauvegardais souvent","Merci, moi du passé."]],
["2 h du matin. Les lumières de la supérette sont étrangement douces.",["Acheter une boisson énergisante et repartir","Les yeux grands ouverts, mais demain fait peur."],["Rentrer dormir","Le futon est moelleux."]],
["Ton poignet droit est lourd. Une tendinite se profile.",["Mettre un patch et s’étirer","Ça va un peu mieux."],["Dessiner à la volonté","Tu as dessiné. Mais ta main hurle."]],

["Un ami dit : « Travailler dans l’animation, ça doit être génial ! »",["Sourire et dire « C’est génial »","Tu te rappelles les vrais moments de bonheur."],["Dire « C’est génial, mais le temps… »","Une fois lancé, impossible de t’arrêter."]],
["Un collègue pose une gourmandise sur ton bureau : « Mange ça. »",["Accepter avec gratitude","Le sucre se diffuse dans tout le corps."],["Dire « Plus tard… » et la laisser","Quand tu y repenses, elle a disparu."]],
["La production écrit : « Les secondes de ce plan ne correspondent pas sur la feuille d’exposition. »",["S’excuser et corriger","Tu avais confondu avec le plan suivant. Remarque utile."],["Dire « Ah bon, pourtant… » et revérifier","En revérifiant, tu avais bien confondu avec le plan suivant."]],
["Emporté par le plaisir, tu as dessiné les clés avec beaucoup trop de détails.",["Rendre tel quel","Retour : « Les intercalaires pleurent, merci de simplifier. »"],["Réduire les traits et simplifier","Les intercalaires sont sauvés. Tout le monde est heureux."]],
["Tu bloques sur les clés de la personne précédente. Qu’a-t-elle dessiné ?",["Déchiffrer par déduction","Résoudre le mystère fait un peu plaisir."],["Aller demander au directeur d’animation","Réponse : « Ah, moi non plus, je ne comprends pas. »"]],
["Tu as besoin d’une référence de pose et tu fais des poses bizarres devant le miroir.",["La photographier avec le téléphone","Les photos introuvables s’accumulent. Mais c’est plus facile à dessiner."],["Dessiner de tête","Les articulations clochent. Tu aurais dû photographier."]],
["Sur les réseaux, un super dessin d’un collègue défile.",["S’inspirer et se motiver","Allez, je dessine aussi."],["Se comparer et déprimer","Tout le monde est incroyable. Mais mes traits ne sont pas mal non plus."]],
["Les nouilles de minuit sont prêtes. Pendant les trois minutes d’attente, tu te mets à dessiner.",["Continuer à dessiner","Les nouilles ont ramolli. Mais tu as avancé."],["Attendre et manger comme il faut","Des nouilles pas ramollies, c’est forcément meilleur."]],
["Retakes sur tous les plans. Le bureau est couvert de Post-it.",["Corriger un par un avec soin","Chaque correction améliore le dessin. Probablement."],["D’abord respirer et boire du thé","Calmé. Mais les Post-it n’ont pas diminué."]],
["Soudain, tu es en pleine forme ! La main bouge toute seule, le jeu s’enchaîne.",["Surfer sur la vague","Tu aimes toi-même le plan d’aujourd’hui."],["Sauvegarder d’abord, puis continuer","Sauvegarder, c’est important. Le flux n’a pas été coupé."]],
["L’anime lancé en fond sonore t’accroche et ta main s’arrête.",["Regarder un épisode jusqu’au bout","Tu t’es perdu dans l’animation. C’est aussi de l’étude, sans doute."],["N’écouter que le son et reprendre","Un plaisir pour les oreilles. Ça suffit pour aujourd’hui."]],
["Ta règle et ta gomme ont disparu du bureau.",["Chercher partout","Elles étaient juste sous ton nez."],["Se débrouiller avec autre chose","Sans tes outils habituels, tu n’es pas à l’aise."]],
["En cherchant des références, tu t’es perdu dans un océan de vidéos.",["Chercher encore un peu","Trois heures ont passé. Tu as oublié ce que tu cherchais."],["Arrêter au bout de 30 minutes et dessiner","Les références manquent, mais en dessinant, tu comprendras."]],
["Avant de dormir, une bonne idée… et le matin, plus rien.",["Dormir sans noter","Où est passée cette composition ?"],["Dormir avec un mémo près de l’oreiller","Le matin, l’écriture était illisible. Mais il en restait quelque chose."]],
["Tes clés n’étaient pas bonnes et le plan a été confié à quelqu’un d’autre.",["Accepter honnêtement","Moins de travail, donc la progression avance. Mais ça pique. À retenir."],["S’entraîner la nuit par dépit","Ce que tu dessines te fera un peu progresser… sans doute."]],
["Un plan dépasse ton niveau. Tu écris à la production.",["Envoyer « Désolé. Je n’y arrive pas. »","Il t’a fallu trois heures pour appuyer sur envoyer."],["L’accepter quand même","Au final, tu l’as dessiné dans la douleur."]],
["Tu as accepté plusieurs travaux à la fois et toutes les échéances approchent.",["Essayer de tout faire","Tout est à moitié fini. Tu sens que tu n’y arriveras pas."],["Prioriser et prévenir","Après une discussion honnête, on t’a étonnamment arrangé ça."]],
["Juste après avoir accepté un travail mal payé, une demande bien payée arrive.",["Refuser à contrecœur","Ta main a un peu tremblé en dessinant le travail mal payé."],["L’accepter en cachette","Ta charge augmente, et aucun des deux n’avance."]],
["Tu as refait le retake, mais il est revenu. Entretien : « Tu as vraiment envie ? »",["Répondre « Oui »","Oui, mais la technique ne suit pas."],["Noter les conseils frénétiquement","En prenant des notes, tu te sens un peu plus positif."]],
["En travaillant, tu t’es juré : « Quand ce travail sera fini, je démissionne. »",["Transformer ce sentiment en énergie","Après, je démissionne. …Et après, qu’est-ce que je fais déjà ?"],["Se glisser sous la couette et oublier","Le lendemain matin, tu te sentais un peu plus léger."]],
["On te demande : « Être animateur, c’est amusant ? »",["Répondre « …Oui, bof. »","Tu ne peux pas l’affirmer fort, mais tu ne peux pas le nier non plus."],["Sourire : « Parfois, oui »","Cette réponse honnête t’a un peu rassuré toi-même."]],
["En travaillant sur papier, tu secoues la pochette du plan et tu crois entendre des pièces tinter.",["Même si c’est une hallucination, ça fait plaisir","Ding. Sans doute mon imagination. Mais même à petit tarif, les petits ruisseaux font les grandes rivières."],["L’ajouter à la liste des plans terminés","Tu as ajouté le plan terminé à la liste. La voir grandir t’apaise."]],
["Un mot du directeur d’animation : « Joli jeu d’acteur, ici. »",["Remercier en rougissant","Tu dessineras de bonne humeur toute la journée."],["Sourire sans le montrer","En y repensant chez toi, tu as encore souri."]],
["Un anime sur lequel tu as travaillé est diffusé. Tu trouves des avis sur les réseaux.",["Lire le cœur battant","Un « l’animation était superbe » a tout racheté."],["Faire défiler discrètement et fermer","Gênant, mais un peu content."]],
["Un grand réalisateur te complimente : « Ce plan était excellent. »",["Revoir les œuvres du réalisateur","Le rythme de ce jeu d’acteur est vraiment impressionnant."],["Le mettre par écrit en note","Tu as noté ses paroles. À relire les jours difficiles."]],
["Il paraît qu’il y a une avant-première pour la sortie Blu-ray d’un anime que tu adores.",["Postuler sans savoir si tu pourras y aller","Tu as appuyé sur Postuler. Si tu gagnes, on verra avec l’échéance."],["Trinquer seul","Un toast en solo, ton anime préféré en apéritif. On redessine demain."]],
["Tu as une idée de jeu d’acteur absente du storyboard.",["La glisser en douce","Tu ne sais pas si ça passera, mais c’était amusant à dessiner."],["Renoncer, faute de confiance","Tu l’as discrètement effacé. Mais ce jeu d’acteur était un peu dommage."]],
["Un fan a publié sur les réseaux une capture d’un plan dont tu as fait les clés.",["Capturer ce message","Le dossier « Boost de moral » compte une image de plus."],["Faire un « yes ! » dans ton cœur","Visage de marbre, mais le poing levé de toutes ses forces à l’intérieur."]],
["Tu es venu voir un film d’animation, il est très beau. Le générique commence.",["Suivre les noms avec attention","Tu as trouvé le nom d’un ancien collègue parti, et tu as été soulagé."],["Ne pas regarder le générique","Tu as privilégié ta tranquillité d’esprit et tu t’es félicité."]],
["Sans t’en rendre compte, tu t’es pris de passion pour la cuisine.",["Attendre chaque jour avec impatience ce que tu vas cuisiner","Ouvrir le frigo est un plaisir. La progression a un peu pris du retard."],["Privilégier le travail et cuisiner moins élaboré","Tu t’es débrouillé avec des repas simples. Un peu triste."]],
["Tu as acheté une télé et découvert que l’interpolation d’images est activée par défaut.",["La laisser telle quelle à contrecœur","En voyant l’image trop fluide, quelque chose en toi a pleuré un peu."],["Ne pas supporter ça et la désactiver coûte que coûte","Une heure à fouiller les réglages. Mais le bon mouvement est revenu."]],
["Un junior dit qu’il ne comprend pas quelque chose… toi non plus.",["Dire « On demandera plus tard » et passer à autre chose","Sur le moment, ça a marché. Tu chercheras discrètement plus tard."],["Vouloir savoir aussi, et demander à un senior","Avouer qu’on ne sait pas demande du courage. Mais vous avez appris ensemble."]],
["Tu as envie d’aller aux toilettes. Mais ton crayon est en pleine forme.",["Se retenir et continuer à dessiner","Tu as dessiné jusqu’à un bon point. En te levant, tout était à la limite."],["Y aller comme il faut","Soulagé. Les traits aussi semblent soulagés."]]];
var KF=[["Grand festin d’after !","Plus tard, tu as été invité à la fête de fin de projet. Tu as mangé de bons plats à ta faim et tu es rentré en souriant. C’était peut-être pour ça que tu travaillais."],["Satisfait à ta façon !","Ce n’est pas devenu une « animation divine » virale. Mais, pour toi, tu as dessiné un plan plutôt satisfaisant. C’est largement suffisant."],["« Tu as progressé ! »","Les autres t’ont dit : « Tu as progressé. » Et on t’a aussitôt proposé le travail suivant. Un bonheur qui donne le tournis."],["Découpé par le compte officiel !","Après la diffusion, le compte officiel a extrait ton plan. Tu as applaudi discrètement devant l’écran."],["Un dessert en récompense !","Après la livraison, tu as acheté le dessert raffiné que tu te refusais. Une bouchée, et tu as murmuré : « J’ai gagné. »"],["Ton nom au générique !","Le jour de la diffusion, tu as trouvé ton nom au générique. Peu importe combien de fois tu le regardes, ça réchauffe le cœur."],["Trois jours de farniente","Après la livraison, tu n’as rien prévu et tu as paressé trois jours. Un vrai bonheur."],["Cadeau d’un senior","« Bon travail », t’a écrit un senior avec une douceur bien chaude. Tu es content d’avoir tenu bon."],["Le prochain projet t’attend","Un message est arrivé : « Pour le prochain aussi, compte sur toi. » Tu as poussé un cri de joie et tu imaginais déjà de nouveaux plans."]];
var HF=[["Endormi sur le bureau…","Quand tu t’es réveillé, c’était le matin. Quelqu’un avait délicatement posé une couverture sur toi. Repose-toi aujourd’hui, et redessine demain."],["Batterie à plat, sommeil profond !","Tu t’es endormi comme une batterie vide. Au réveil, une boulette de riz t’attendait près de l’oreiller. Quelle attention."],["Sieste obligatoire","Un collègue a dit : « Rentre dormir aujourd’hui. » Tu as obéi, et le futon était un paradis."],["Dessiner en rêve","Dans ton rêve, dessiner était facile. Tu as noté cette sensation avant qu’elle ne s’efface."],["Un vrai repos","Tu as osé prendre un jour de repos : bain, bon repas, longue nuit. Quand tu auras récupéré, on redessinera."],["Inscrit au cours d’étirements","Dos et épaules au bout du rouleau. Tu as décidé de suivre un cours d’étirements. Ton corps s’assouplit, et tes traits aussi, semble-t-il."],["Détente aux sources chaudes","Après t’être effondré, tu as récupéré lentement dans un bain chaud. Le lait au café après le bain était le meilleur du monde."],["Montagne de friandises","Affalé sur ton bureau, tu as vu les friandises s’accumuler autour de toi. Tu as récupéré en riant devant cette montagne de snacks."],["Nouvelle chaise","Le dos à bout, tu as enfin acheté une bonne chaise. À peine assis, c’était le paradis. Tu as hâte d’être à demain."],["Plan lève-tôt","Tu as décidé de revoir ton rythme. Les dessins faits sous le soleil du matin ont des traits plus lumineux que d’habitude."]];
var MF=[["Petite escapade","Pour te ressaisir, tu es allé aux sources chaudes. Dans la vapeur, tu as pensé : « Ça va s’arranger. »"],["Une journée avec des chats","Tu as arrêté de dessiner pour regarder des vidéos de chats toute la journée. Les chats réconfortent sans dire un mot."],["Un ami t’a écouté","Tu as dîné avec un ami et tu t’es plaint à cœur joie. À force de rire, tu t’es senti plus léger."],["Marathon d’anime","Pour te changer les idées, tu as enchaîné ton anime préféré. Tu t’es rappelé combien l’animation est belle. Demain, tu pourras sans doute redessiner."],["Karaoké en solo","Tu as osé aller au karaoké tout seul. En criant à pleins poumons, tu t’es vidé la tête. Gorge enrouée, cœur en forme."],["Ressuscité par un ramen","Quand le moral baisse, rien ne vaut un bon repas. La vapeur du ramen brûlant a aussi réchauffé ton cœur."],["Les yeux vers le ciel","Tu es sorti regarder le ciel et un nuage avait l’air délicieux. Rien que ça t’a fait sourire."],["Revoir tes anciennes clés","En revoyant tes anciens dessins, tu as pensé : « Finalement, j’ai bien travaillé. » Tu t’es un peu plus apprécié."],["Apéro en ligne entre collègues","Vous avez râlé ensemble en visio. Tout le monde peinait sur les mêmes choses, et vous n’arriviez plus à vous arrêter de rire."],["Un dessin tout en légèreté","Oubliant le travail, tu as griffonné. Ce dessin improvisé s’est avéré étonnamment mignon."]];

["Abres YouTube para buscar referencias. De pronto estás viendo vídeos de gatos.",["Verlos hasta el final","Los gatos son justicia. Luego miras el reloj y te quedas pálido."],["Cerrarlo enseguida","Admirable. Pero querías ver los gatos."]],

["Un compañero deja un dulce en tu mesa: “Cómete esto”.",["Aceptarlo agradecido","El azúcar recorre todo el cuerpo."],["Decir “Luego…” y dejarlo","Cuando te das cuenta, ya no está."]],

["Necesitas una referencia de pose y estás haciendo poses raras ante el espejo.",["Fotografiarte con el móvil","Se acumulan fotos que no puedes enseñar. Pero se dibuja más fácil."],["Dibujar de memoria","Las articulaciones fallan. Debiste fotografiarte."]],

var KS=[["¡Gran festín de celebración!","Más adelante te invitaron a la fiesta de fin de proyecto. Comiste platos deliciosos hasta hartarte y volviste a casa sonriendo. Quizá trabajaste por esto."],["¡Satisfecho a tu manera!","No se hizo viral como “animación divina”. Pero, para ti, dibujaste un plano bastante satisfactorio. Con eso basta."],["“¡Has mejorado!”","Los demás te dijeron: “Has mejorado”. Y enseguida te ofrecieron el siguiente trabajo. Un problema feliz."],["¡Recortado por la cuenta oficial!","Tras la emisión, la cuenta oficial publicó tu plano. Aplaudiste en silencio frente a la pantalla."],["¡Postre de recompensa!","Tras la entrega, compraste el postre caro que te negábas. Un bocado y murmuraste: “He ganado”."],["¡Tu nombre en los créditos!","El día de la emisión encontraste tu nombre en los créditos. Por muchas veces que lo veas, te calienta el corazón."],["Tres días de descanso","Tras la entrega no planeaste nada y holgazaneaste tres días. Pura felicidad."],["Un detalle de un senior","“Buen trabajo”, te escribió un senior con un detalle cálido. Alegra haber seguido adelante."],["El próximo proyecto te espera","Llegó un mensaje: “Cuento contigo también para el próximo”. Gritaste de alegría y ya imaginabas planos nuevos."]];
var HS=[["Dormido en el escritorio…","Al despertar ya era de mañana. Alguien te había puesto una manta con cuidado. Descansa hoy y vuelve a dibujar."],["¡Batería agotada, sueño profundo!","Te dormiste como una batería sin carga. Al despertar, había una bola de arroz junto a la almohada. Qué detalle."],["Hora de siesta obligatoria","Un compañero dijo: “Vete a casa a dormir hoy”. Obedeciste y el futón era un paraíso."],["Dibujar en sueños","En el sueño, dibujar era facilísimo. Apuntaste esa sensación antes de que se esfumara."],["Un buen descanso","Decidiste tomarte un día libre: baño, buena comida, mucho sueño. Cuando te recuperes, a dibujar."],["Apuntado a clases de estiramientos","Espalda y hombros al límite. Decidiste apuntarte a una clase de estiramientos. El cuerpo se suelta y los trazos parecen más suaves."],["Relax en las aguas termales","Tras desplomarte, te recuperaste despacio en unas termas. La leche con café de después fue la mejor del mundo."],["Montaña de golosinas","Desplomado sobre el escritorio, fueron llegando golosinas de todos lados. Te recuperaste riendo ante la montaña de dulces."],["Silla nueva","Con la espalda al límite, por fin compraste una buena silla. Al sentarte fue como el cielo. Tienes ganas de mañana."],["Plan de madrugar y acostarse temprano","Decidiste revisar tu ritmo de vida. Lo dibujado bajo el sol de la mañana tiene trazos más luminosos que de costumbre."]];
var MS=[["Pequeña escapada","Para despejarte, fuiste a unas termas cercanas. Entre el vapor pensaste: “Saldrá bien”."],["Un día con gatos","Dejaste de dibujar y viste vídeos de gatos todo el día. Los gatos consuelan sin decir nada."],["Un amigo te escuchó","Cenaste con un amigo y te desahogaste a gusto. Entre risas te sentiste más ligero."],["Maratón de anime","Para animarte, te viste tu anime favorito del tirón. Recordaste lo bonita que es la animación. Mañana seguramente podrás dibujar."],["Karaoke en solitario","Te atreviste a ir solo al karaoke. Cantando a gritos, se te despejó la cabeza. Garganta ronca, corazón contento."],["Resucitado por un ramen","Cuando decaes, nada como comer rico. El vapor del ramen caliente también te calentó el corazón."],["Mirando al cielo","Saliste y miraste al cielo; una nube parecía deliciosa. Solo eso te sacó una sonrisa."],["Repasar tus claves antiguas","Al ver tus dibujos antiguos pensaste: “Pues me esforcé bastante”. Te caíste un poco mejor."],["Cañas en línea con los compañeros","Os quejasteis juntos por videollamada. Todos sufrían por lo mismo y no podíais parar de reír."],["Un dibujo relajado","Olvidando el trabajo, garabateaste. Ese dibujo improvisado salió sorprendentemente simpático."]];

["نشر معجب لقطة شاشة من لقطة رسمتَ رسوماتها الرئيسية.",["تلتقط لقطة شاشة لتلك التغريدة","في مجلد «صور تمنحني الحماس» صورة أخرى الآن."],["تحتفل بقبضة يدك في داخلك","وجه جامد من الخارج، وقبضة مرفوعة بكل قوتك في الداخل."]],
["جئتَ لمشاهدة فيلم أنمي وكان رائعًا. بدأت الشارة الختامية.",["تتتبّع الأسماء بعينيك بعناية","وجدتَ اسم زميل قديم ترك العمل، فارتحتَ."],["لا تشاهد الشارة","فضّلتَ راحة بالك وأثنيتَ على نفسك."]],
["دون أن تشعر، صرتَ مولعًا بالطبخ.",["تترقّب كل يوم ماذا ستطبخ","فتح الثلاجة متعة. تأخّر التقدّم قليلًا."],["تقدّم العمل وتقلّل من الطبخ المعقّد","تدبّرتَ أمرك بوجبات بسيطة. حزين قليلًا."]],
["اشتريتَ تلفازًا فلاحظتَ أن ميزة استيفاء الإطارات مفعّلة افتراضيًا.",["تتركها كما هي على مضض","وأنت ترى الصورة السلسة جدًا، بكى شيء ما بداخلك قليلًا."],["لا تحتمل فتطفئها مهما كلّف الأمر","ساعة تبحث في الإعدادات. لكن الحركة الصحيحة عادت."]],
["قال زميل مبتدئ إنه لا يفهم شيئًا… وأنت أيضًا لا تفهمه.",["تقول «سنسأل لاحقًا» وتتجاوز الأمر","مرّت اللحظة. ستبحث عنه خلسة لاحقًا."],["تريد أن تعرف أنت أيضًا، فتسأل زميلًا أقدم","الاعتراف بعدم المعرفة يحتاج شجاعة. لكنكما تعلّمتما معًا."]],

var KR=[["وليمة الاحتفال!","في وقت لاحق دُعيتَ إلى حفل ختام المشروع. أكلتَ طعامًا شهيًا حتى الشبع وعدتَ مبتسمًا. ربما عملتَ من أجل هذا."],["راضٍ بطريقتك!","لم يصبح «رسمًا إلهيًا» ينتشر على الإنترنت. لكنك رسمتَ لقطة ترضيك إلى حدّ كبير. وهذا يكفي."],["«لقد تحسّنتَ!»","قال لك من حولك: «لقد تحسّنتَ.» وعُرض عليك العمل التالي فورًا. مشكلة سعيدة."],["اقتُطعت لقطتك في الحساب الرسمي!","بعد العرض، نشر الحساب الرسمي لقطتك. صفّقتَ بهدوء أمام الشاشة."],["حلوى المكافأة!","بعد التسليم، اشتريتَ الحلوى الفاخرة التي كنتَ تمنع نفسك عنها. لقمة واحدة وهمستَ: «لقد فزتُ.»"],["اسمك في الشارة الختامية!","يوم العرض وجدتَ اسمك في الشارة الختامية. مهما نظرتَ إليه، يدفئ قلبك."],["ثلاثة أيام من الاسترخاء","بعد التسليم لم تخطّط لشيء وتكاسلتَ ثلاثة أيام. سعادة خالصة."],["هدية من زميل أقدم","أرسل لك زميل أقدم هدية دافئة مع «أحسنتَ». يسعدك أنك واصلتَ."],["العمل التالي ينتظرك","وصلت رسالة: «نعوّل عليك في التالي أيضًا.» صرختَ فرحًا وكنتَ تتخيّل لقطات جديدة."]];
var HR=[["غفوتَ على المكتب…","استيقظتَ فكان الصباح. وضع أحدهم بطانية عليك بلطف. استرح اليوم ثم عُد للرسم."],["نفدت البطارية ونمتَ بعمق!","نمتَ كأن بطاريتك فرغت. وحين استيقظتَ وجدتَ كرة أرز بجانب الوسادة. يا للطف."],["وقت قيلولة إجباري","قال زميل: «اذهب إلى البيت ونَم اليوم.» أطعتَ وكان الفراش كالجنة."],["الرسم في الحلم","في الحلم كان الرسم سهلًا جدًا. دوّنتَ ذلك الإحساس قبل أن يتلاشى."],["راحة حقيقية","قررتَ أخذ يوم إجازة: حمّام وطعام جيد ونوم طويل. وحين تتعافى نعود للرسم."],["انضممتَ لصف التمدد","ظهرك وكتفاك في أقصى حدودهما. قررتَ الالتحاق بصف تمدد. ارتخى جسمك وبدت خطوطك أنعم."],["استرخاء في الينابيع الساخنة","بعد أن انهرتَ تعافيتَ ببطء في ينبوع ساخن. حليب القهوة بعد الحمام كان أطيب شيء في العالم."],["جبل من الحلويات","وأنت منهار على مكتبك، تجمّعت حولك الحلويات من الجميع. تعافيتَ وأنت تضحك أمام جبل الوجبات."],["كرسي جديد","مع ظهر وصل حدّه، اشتريتَ أخيرًا كرسيًا جيدًا. ما إن جلستَ حتى شعرتَ بالجنة. تترقّب عمل الغد."],["خطة النوم المبكر والاستيقاظ المبكر","قررتَ مراجعة إيقاع حياتك. الرسم تحت شمس الصباح أعطى خطوطك سطوعًا أكبر من المعتاد."]];
var MR=[["رحلة قصيرة لتجديد المزاج","لترتّب مزاجك ذهبتَ إلى ينبوع ساخن قريب. وسط البخار فكّرتَ: «سيكون كل شيء على ما يرام.»"],["يوم مع القطط","توقفتَ عن الرسم وشاهدتَ فيديوهات القطط طوال اليوم. القطط تواسيك دون أن تقول كلمة."],["صديق أنصت إليك","تعشّيتَ مع صديق وفرّغتَ ما بصدرك. ومع الضحك شعرتَ بخفة."],["ماراثون أنمي","لتغيير مزاجك شاهدتَ أنمي المفضل دفعة واحدة. تذكّرتَ كم الأنمي جميل. تشعر أنك ستستطيع الرسم غدًا."],["كاريوكي منفرد","تجرأتَ وذهبتَ إلى الكاريوكي وحدك. غنّيتَ بأعلى صوتك فصفا رأسك. حلق مبحوح وقلب مرتاح."],["انتعشتَ بالرامن","حين يتعكّر المزاج، لا شيء كالأكل اللذيذ. بخار الرامن الساخن أدفأ قلبك أيضًا."],["النظر إلى السماء","خرجتَ ونظرتَ إلى السماء فبدت سحابة شهيّة الشكل. هذا وحده جعلك تبتسم."],["مراجعة رسوماتك القديمة","وأنت تنظر إلى رسوماتك القديمة فكّرتَ: «يبدو أنني بذلتُ جهدًا.» أحببتَ نفسك أكثر قليلًا."],["جلسة شرب عبر الإنترنت مع الزملاء","تذمّرتم معًا عبر مكالمة فيديو. كان الجميع يعانون من الأمور نفسها ولم تتوقفوا عن الضحك."],["رسم مرح بلا قيود","نسيتَ العمل وخربشتَ. خرج الرسم الارتجالي لطيفًا على غير المتوقع."]];
